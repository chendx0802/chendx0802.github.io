<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">项目演示占位图</title>
  <desc id="desc">替换为项目图片或动态 WebP</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181a20"/>
      <stop offset="1" stop-color="#75443c"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#f5c1a8" stop-opacity=".8"/>
      <stop offset="1" stop-color="#f5c1a8" stop-opacity="0"/>
